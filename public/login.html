<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Tapula</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1ea;font-family:Inter,system-ui,sans-serif;color:#1c1a17}
  form{width:min(360px,90vw);background:#fff;border:1px solid #e6e0d7;border-radius:20px;padding:28px}
  .brand{display:flex;align-items:center;gap:10px;font:800 22px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin-bottom:22px}
  .logo{width:26px;height:26px;border-radius:8px;background:#ff5a36;box-shadow:6px 0 0 -2px #1c1a17}
  label{display:block;font-size:13px;color:#77716a;margin-bottom:6px}
  input{width:100%;font:inherit;padding:11px 12px;border:1px solid #e6e0d7;border-radius:10px}
  input:focus{outline:none;border-color:#1c1a17}
  button{margin-top:14px;width:100%;font:600 15px Inter,sans-serif;padding:11px;border-radius:10px;border:0;background:#1c1a17;color:#fff;cursor:pointer}
  .err{color:#c0392b;font-size:13px;margin-top:10px;min-height:1em}
</style>
</head>
<body>
<form id="f">
  <div class="brand"><span class="logo"></span>Tapula</div>
  <label for="un">Username</label>
  <input id="un" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
  <label for="pw" style="margin-top:12px">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var err = document.getElementById('err'); err.textContent='';
  var b = this.querySelector('button'); b.disabled = true;
  try{
    var r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('un').value,password:document.getElementById('pw').value})});
    if(r.ok){ location.href='/admin'; return; }
    err.textContent = (await r.json().catch(function(){return {};})).error || 'Sign-in failed.';
  }catch(x){ err.textContent='Could not reach the server.'; }
  b.disabled = false;
});
</script>
</body>
</html>
