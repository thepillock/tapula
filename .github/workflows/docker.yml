name: Build and publish Docker image

# main -> ghcr.io/thepillock/tapula:latest
# test -> ghcr.io/thepillock/tapula:test
on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick image tag
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then echo "tag=latest" >> "$GITHUB_OUTPUT"
          else echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tapula" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
